[project]
name = "qc-pack-builder"
version = "0.1.0"
description = "Quran Companion QDS import pipeline and .qpack builder (handbook §6.3, §6.5)"
requires-python = ">=3.12"
dependencies = [
    "qc-shared",
    "cryptography>=44.0",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "referencing>=0.36",
    "sqlalchemy>=2.0",
]

[project.scripts]
pack-builder = "pack_builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]

[tool.uv.sources]
qc-shared = { path = "../../shared/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pack_builder"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: golden data gates (§23, rule R8) — require the upstream corpus cache",
]
