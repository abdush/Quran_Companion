[project]
name = "qc-api"
version = "0.0.1"
description = "Quran Companion API — FastAPI modular monolith (scaffold, task 0.1)"
requires-python = ">=3.12"
dependencies = [
    "qc-shared",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "import-linter>=2.3",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "referencing>=0.36",
    "ruff>=0.11",
]

[tool.uv.sources]
qc-shared = { path = "../../shared/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Boundary lint (Python side) — encodes handbook §9.1 / §21:
# bounded contexts never import each other's internals. Universal rule R4:
# never suppress to make a PR pass. Stub created by Task 0.1 (DevOps);
# the planned refinement (allowing only `<ctx>.api` public interfaces
# across contexts) goes through the Interface Change Protocol.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent (§9.1)"
type = "independence"
modules = [
    "app.usr",
    "app.ann",
    "app.hfz",
    "app.qds",
    "app.kb",
    "app.tutor",
    "app.sync",
    "app.fam",
    "app.cm",
]

# TestClient drives the app from a portal thread; without this, coverage misses
# every line executed inside a request handler.
[tool.coverage.run]
concurrency = ["thread", "greenlet"]
source = ["app"]
