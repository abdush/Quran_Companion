[project]
name = "qc-api"
version = "0.0.1"
description = "Quran Companion API — FastAPI modular monolith (scaffold, task 0.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.3",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# Boundary lint (Python side) — encodes handbook §9.1 / §21:
# bounded contexts never import each other's internals. Universal rule R4:
# never suppress to make a PR pass. Stub created by Task 0.1 (DevOps);
# the planned refinement (allowing only `<ctx>.api` public interfaces
# across contexts) goes through the Interface Change Protocol.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent (§9.1)"
type = "independence"
modules = [
    "app.usr",
    "app.ann",
    "app.hfz",
    "app.qds",
    "app.kb",
    "app.tutor",
    "app.sync",
    "app.fam",
    "app.cm",
]
